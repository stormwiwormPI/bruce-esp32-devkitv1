; PlatformIO Project Configuration File
;
; ESP32 DevKit V1  (ESP32-D0WD-V3, WROOM-32, 4MB flash, NO PSRAM)
;
; Community board model - not an official Bruce release target.
; The screen is virtual: see the VIRTUAL DISPLAY section below.
;
; Strategy:
;   * base flags from [env], so -DLH/-DLW/-flto etc. are all inherited
;   * plus the Flash-saving trims from upstream's [env_4mb] profile
;   * lib_ignore drops FastLED / ESP8266Audio / ESP8266SAM.
;     FastLED is only reached under #ifdef HAS_RGB_LED (not defined here) and
;     ESP8266Audio only under #ifdef HAS_NS4168_SPKR (not defined here).
;     This also sidesteps a real name clash: Bruce defines FP/FM/FG as font
;     sizes, while FastLED 3.10.7 exports a colliding FP() fixed-point
;     constructor in its fl/build translation units.

[env:esp32-devkitv1]
board = esp32-devkitv1

; custom_4Mb.csv only leaves 2.5MB for the app, but a trimmed Bruce is
; ~3.52MB. custom_4Mb_full.csv is upstream's 4MB layout that maximises the
; app partition (0x3C0000 = 3,932,160 bytes) and keeps a 192KB LittleFS.
board_build.partitions = custom_4Mb_full.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3932160

build_src_filter =
	${env.build_src_filter}
	+<../boards/esp32-devkitv1>

build_flags =
	${env.build_flags}
	-Os
	-Iinclude
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1

	; The ESP32 copy of libnet80211.a shipped with the prebuilt Arduino libs
	; is an older IDF build, so it still carries
	; ieee80211_raw_frame_sanity_check in ieee80211_output.o. Bruce supplies
	; its own definition in src/modules/wifi/wifi_atks.cpp and is listed
	; first, so let the first definition win rather than failing the link.
	-Wl,--allow-multiple-definition

	; --- Flash trims from the 4MB profile -------------------------------
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_HASH=true
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

	; --- Board identity --------------------------------------------------
	-DESP32_DEVKITV1
	-DDEVICE_NAME='"ESP32 DevKit V1"'

	; --- Status LED (GPIO2, onboard blue) --------------------------------
	-DTXLED=2
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; --- IR: TX on outputs, RX on inputs ---------------------------------
	-DIR_TX_PINS='{{"GPIO4", 4}, {"GPIO5", 5}, {"GPIO13", 13}, {"GPIO16", 16}}'
	-DIR_RX_PINS='{{"GPIO14", 14}, {"GPIO17", 17}, {"GPIO18", 18}, {"GPIO19", 19}}'

	; --- RF one-pin modules ---------------------------------------------
	-DRF_TX_PINS='{{"GPIO4", 4}, {"GPIO5", 5}, {"GPIO13", 13}}'
	-DRF_RX_PINS='{{"GPIO14", 14}, {"GPIO17", 17}}'

	; --- CH9329 serial HID bridge (BadUSB / BLE keyboard over UART1) -----
	; The original ESP32 has no native USB, so USB_as_HID is unavailable and
	; Bruce uses a CH9329 attached to a UART instead. UART1's default pins
	; (16/17) are already used by W5500 and nRF24 here, so remap to free GPIOs.
	-DBAD_TX=25
	-DBAD_RX=26

	; --- CC1101 over VSPI -------------------------------------------------
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=13
	-DCC1101_SS_PIN=5
	-DCC1101_MOSI_PIN=23
	-DCC1101_SCK_PIN=18
	-DCC1101_MISO_PIN=19

	; --- nRF24 over VSPI --------------------------------------------------
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=17
	-DNRF24_SS_PIN=5
	-DNRF24_MOSI_PIN=23
	-DNRF24_SCK_PIN=18
	-DNRF24_MISO_PIN=19

	; --- shared SPI bus ---------------------------------------------------
	-DSPI_SCK_PIN=18
	-DSPI_MOSI_PIN=23
	-DSPI_MISO_PIN=19
	-DSPI_SS_PIN=5

	; --- microSD over VSPI ------------------------------------------------
	-DSDCARD_CS=33
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

	; --- W5500 ethernet ---------------------------------------------------
	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=16
	-DW5500_INT_PIN=17

	; --- VIRTUAL DISPLAY ----------------------------------------------------
	; This project is display-only-in-a-browser: no panel is ever fitted and
	; none is supported. Two flags are needed and they are not redundant:
	;
	;   HAS_SCREEN       main.cpp gates the whole graphical menu loop on it,
	;                    so without it the menu never compiles or runs.
	;   VIRTUAL_DISPLAY  tftLogger.h uses this to keep the base class as
	;                    SerialDisplayClass (VectorDisplay - pure software)
	;                    instead of tft_display (TFT_eSPI), so no SPI traffic
	;                    is generated for hardware that does not exist.
	;
	; Together, getBinLog() returns the real menu as draw commands and the
	; WebUI's Navigator tab paints them on a <canvas>.
	;
	; No TFT_CS / TFT_DC / TFT_RST / TFT_MOSI / TFT_SCLK / TFT_BL are defined:
	; those drive a physical panel, so they are deliberately absent. Do not add
	; them - this port does not support a real display.
	-DHAS_SCREEN
	-DVIRTUAL_DISPLAY=1

	; Canvas geometry only.
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DROTATION=1
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DSMOOTH_FONT=1

	; --- font sizes -------------------------------------------------------
	-DFP=1
	-DFM=2
	-DFG=3

	; --- no user buttons --------------------------------------------------
	-DBTN_ALIAS='"OK"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM
